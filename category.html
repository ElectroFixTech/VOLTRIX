<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>Category | VOLTRIX</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#f4f7ff;font-family:Arial,sans-serif}.top{padding:18px 5%;background:#0c1525;border-bottom:1px solid #293a56;display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:25px;font-weight:900;letter-spacing:2px;color:#19d3e6}.top a{color:#19d3e6;text-decoration:none}.wrap{max-width:1300px;margin:30px auto;padding:0 18px}h1{font-size:clamp(24px,5vw,38px)}.muted{color:#9aabc4}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:22px}.card{background:#111a2b;border:1px solid #293a56;border-radius:13px;overflow:hidden}.media{height:165px;background:#e5efff;display:grid;place-items:center}.media img{width:100%;height:100%;object-fit:contain;padding:12px}.symbol{font-size:65px;color:#087cff}.info{padding:13px}.info h3{font-size:15px;min-height:38px}.price{color:#19d3e6;font-weight:900;font-size:18px}.empty{padding:25px;border:1px dashed #293a56;border-radius:12px;color:#9aabc4}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head>
<body><header class="top"><div class="logo">ϟ VOLTRIX</div><a href="index.html">← Back to store</a></header><main class="wrap"><h1 id="heading">Category</h1><p class="muted" id="count">Loading products...</p><div class="grid" id="products"></div></main>
<script>
const URL="https://zqzramrhfphvifmayycu.supabase.co",KEY="sb_publishable_nw8wlcJkd8DHZ2DEmurqZw_y7EpvpVO";
const params=new URLSearchParams(location.search),name=params.get("name")||"";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("heading").textContent=name||"Category";
(async()=>{const list=document.getElementById("products");if(!name){document.getElementById("count").textContent="Choose a category from the store.";list.innerHTML='<div class="empty">No category selected.</div>';return;}try{const url=URL+"/rest/v1/products?select=*&active=eq.true&category=eq."+encodeURIComponent(name)+"&order=created_at.desc";const r=await fetch(url,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!r.ok)throw Error("Could not load products ("+r.status+")");const data=await r.json();document.getElementById("count").textContent=data.length+" products";list.innerHTML=data.map(p=>'<article class="card" data-product-id="'+esc(p.id)+'" style="cursor:pointer" onclick="if(event.target.closest(\'a\'))return;location.href=\'product.html?id='+encodeURIComponent(p.id)+'\'"><div class="media">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':'<span class="symbol">ϟ</span>')+'</div><div class="info"><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description||"")+'</p><div class="price">'+(Number(p.price||0)===0?'Price on request':Number(p.price||0).toLocaleString()+" EGP")+'</div>'+(Number(p.price||0)===0?'<a style="display:block;margin-top:12px;color:#19d3e6;font-weight:800" href="https://wa.me/201015158101?text='+encodeURIComponent("Hello VOLTRIX, please confirm price and availability for: "+p.name)+'" target="_blank" rel="noopener noreferrer">Ask for Price on WhatsApp</a>':'')+'</div></article>').join("")||'<div class="empty">No products in this category yet.</div>';}catch(e){document.getElementById("count").textContent="";list.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}})();
</script></body></html>
