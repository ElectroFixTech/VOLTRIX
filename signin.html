<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>Sign in | VOLTRIX</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#12315b,transparent 55%),#080d18;color:#f4f7ff;font-family:Arial,sans-serif}.panel{width:min(100%,440px);padding:28px;background:#111a2b;border:1px solid #293a56;border-radius:18px;box-shadow:0 20px 60px #0007}.logo{font-size:28px;font-weight:900;letter-spacing:3px;color:#19d3e6;text-align:center;margin-bottom:8px}.sub{text-align:center;color:#9aabc4;margin-bottom:24px}label{display:block;margin:14px 0 7px;color:#cbd8ec}input{width:100%;padding:14px;border:1px solid #354b6b;border-radius:9px;background:#0b1322;color:white;font-size:16px}button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:9px;background:linear-gradient(90deg,#087cff,#00bce9);color:white;font-weight:800;font-size:15px;cursor:pointer}.switch{background:transparent;border:1px solid #2d527c}.msg{min-height:22px;color:#31d8e8;text-align:center;margin-top:14px;overflow-wrap:anywhere}.back{display:block;text-align:center;color:#19d3e6;margin-top:18px;text-decoration:none}.hidden{display:none}</style></head>
<body><main class="panel"><div class="logo">ϟ VOLTRIX</div><p class="sub" id="subtitle">Sign in to your account</p>
<button class="oauth" id="googleLogin" type="button" style="background:#fff;color:#202124;border:1px solid #d7dce5;margin-top:0;display:flex;align-items:center;justify-content:center;gap:12px"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44z"/><path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8z"/><path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3c1.6-4.8 6.1-8.3 11.4-8.3z"/></svg><span>Sign in with Google</span></button><button class="oauth" id="facebookLogin" type="button" style="background:#1877F2;color:#fff;border:1px solid #1877F2;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:12px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="white" d="M13.5 21v-8.2h2.8l.4-3.2h-3.2v-2c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H7.3v3.2h2.8V21z"/></svg><span>Continue with Facebook</span></button><p style="text-align:center;color:#91a2bb;margin:18px 0 4px">or use email</p><form id="authForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"><button id="submit" type="submit">Sign in</button></form>
<button class="switch" id="toggle" type="button">Create a new account</button><p class="msg" id="message" role="status"></p><a class="back" href="index.html">← Back to store</a></main>
<script>
const client=supabase.createClient("https://zqzramrhfphvifmayycu.supabase.co","sb_publishable_nw8wlcJkd8DHZ2DEmurqZw_y7EpvpVO");
let signup=false;
async function socialLogin(provider){msg.textContent="Connecting to "+(provider==="facebook"?"Facebook":"Google")+"...";try{const {error}=await client.auth.signInWithOAuth({provider,options:{redirectTo:"https://electrofixtech.github.io/VOLTRIX/signin.html" ,scopes:provider==="azure"?"email":""}});if(error)throw error;}catch(err){msg.textContent=err.message||"Could not start social sign-in.";}}
document.getElementById("googleLogin").addEventListener("click",()=>socialLogin("google"));
document.getElementById("facebookLogin").addEventListener("click",()=>socialLogin("facebook"));
const form=document.getElementById("authForm"),msg=document.getElementById("message"),submit=document.getElementById("submit"),toggle=document.getElementById("toggle");
toggle.addEventListener("click",()=>{signup=!signup;document.getElementById("subtitle").textContent=signup?"Create your VOLTRIX account":"Sign in to your account";submit.textContent=signup?"Create account":"Sign in";toggle.textContent=signup?"I already have an account":"Create a new account";document.getElementById("password").autocomplete=signup?"new-password":"current-password";msg.textContent="";});
form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;msg.textContent=signup?"Creating account...":"Signing in...";const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;try{const result=signup?await client.auth.signUp({email,password,options:{emailRedirectTo:"https://electrofixtech.github.io/VOLTRIX/signin.html?confirmed=true"}}):await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(signup&&!result.data.session){msg.textContent="Account created. Check your email to confirm your address, then sign in.";return;}msg.textContent=signup?"Account created successfully.":"Signed in successfully.";setTimeout(()=>location.href=(new URLSearchParams(location.search).get("next")==="checkout"?"index.html#cart":"index.html"),700);}catch(err){msg.textContent=err.message||"Could not complete sign in.";}finally{submit.disabled=false;}});
if(new URLSearchParams(location.search).get("confirmed")==="true"){msg.textContent="Email confirmed successfully. You can now sign in.";}
let redirecting=false;
function goToStore(){if(redirecting)return;redirecting=true;msg.textContent="Signed in. Opening VOLTRIX...";const next=new URLSearchParams(location.search).get("next");location.replace(next==="checkout"?"index.html#cart":"index.html");}
client.auth.onAuthStateChange((event,session)=>{if(session&&(event==="SIGNED_IN"||event==="INITIAL_SESSION"||event==="TOKEN_REFRESHED"))goToStore();});
client.auth.getSession().then(({data,error})=>{if(error){msg.textContent=error.message;return;}if(data.session)goToStore();});
</script></body></html>
