name: Deploy VOLTRIX order function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/create-order/**"
      - "supabase/functions/list-customers/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-order-function.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy create-order function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref zqzramrhfphvifmayycu
          supabase functions deploy create-order --project-ref zqzramrhfphvifmayycu --yes
          supabase functions deploy list-customers --project-ref zqzramrhfphvifmayycu --yes
